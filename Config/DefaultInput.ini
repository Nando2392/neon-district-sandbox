; Enhanced Input bindings are configured in code (NDPlayerController).
; Two systems: Enhanced Input (runtime-created) and Fallback Classic Input.
;
; For builds: the fallback system handles input without pre-cooked assets.
; For PIE/Editor: Enhanced Input is used with runtime-created actions.
;
; The classic mappings below MUST exist in this file: the fallback binds
; axis/action names, and Unreal only delivers input for names registered in
; InputSettings. Without these, WASD/mouse/keys are dead in the packaged exe
; (the Enhanced Input subsystem also fails to get a valid PlayerInput in
; packaged builds, so the fallback is the only working path there).

[/Script/Engine.InputSettings]
; --- Movement axes ---
AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=W)
AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=S)
AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=Up)
AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=Down)
AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=D)
AxisMappings=(AxisName="MoveRight",Scale=-1.000000,Key=A)
AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=Right)
AxisMappings=(AxisName="MoveRight",Scale=-1.000000,Key=Left)

; --- Look axes (mouse) ---
AxisMappings=(AxisName="Turn",Scale=1.000000,Key=MouseX)
AxisMappings=(AxisName="LookUp",Scale=1.000000,Key=MouseY)

; --- Actions ---
ActionMappings=(ActionName="Jump",Key=SpaceBar,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
ActionMappings=(ActionName="Sprint",Key=LeftShift,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
ActionMappings=(ActionName="Interact",Key=E,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
ActionMappings=(ActionName="EnterVehicle",Key=F,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
ActionMappings=(ActionName="Pause",Key=Escape,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
ActionMappings=(ActionName="QuickSave",Key=F5,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
ActionMappings=(ActionName="QuickLoad",Key=F9,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
ActionMappings=(ActionName="Fire",Key=LeftMouseButton,bShift=False,bCtrl=False,bAlt=False,bCmd=False)

bAltEnterTogglesFullscreen=True
bF11TogglesFullscreen=True
bUseMouseForTouch=False
bEnableMouseSmoothing=True
bEnableFOVScaling=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
